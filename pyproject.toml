[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batchbpe"
version = "1.0.0"
description = "Safely batched, pure python BPE tokenizer. Forked from Andrej Karpathy's minbpe."
authors = [
    {name = "Alexander Morgan"},
    {name = "Andrej Karpathy"}
]
requires-python = ">=3.9"
dependencies = [
    "joblib",
    "regex",
    "tiktoken",
    "requests",
    "pyarrow>=21.0.0",
    "psutil",
    "numpy>=2.0.2",
    "pytest>=8.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
packages = ["batchbpe"] 
